schema_version = "1.4"

[task]
name = "ticket-eval-suite/easy-password-reset"
version = "1.0.0"
description = "Triage a messy password reset request and emit a resolution file."
authors = [{ name = "TriageBench", email = "eval@triage-bench.dev" }]
keywords = ["customer-support", "triage", "password-reset", "easy"]

[metadata]
difficulty = "easy"
category = "customer-support"

[agent]
timeout_sec = 300.0
user = "root"
network_mode = "allowlist"
allowed_hosts = ["*.openrouter.ai", "openrouter.ai"]

[verifier]
timeout_sec = 120.0
user = "root"
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
network_mode = "public"
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240